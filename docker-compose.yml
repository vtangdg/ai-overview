services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GLM_API_KEY=${GLM_API_KEY}
    volumes:
      - visitor_stats_data:/app/db
      # 站内知识笔记：只读挂载进容器，供 RAG 索引服务扫描（笔记更新后调 POST /api/rag/index/rebuild 重建索引）
      - ./frontend/public/lib/notes:/app/notes:ro
    restart: unless-stopped
    networks:
      - monitoring

  # Prometheus 服务（按需启动：docker compose --profile monitoring up -d）
  # 归入 monitoring profile，默认 docker compose up 不启动，避免日常占用资源
  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - backend

  # Grafana 服务（与 Prometheus 同属 monitoring profile，按需启动）
  grafana:
    image: grafana/grafana:12.3
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  visitor_stats_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge