spring:
  datasource:
    url: jdbc:sqlite:./ai-demo/db/visitor_stats.db
    driverClassName: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

# RAG 本地开发路径。注意工作目录差异：
# - IDEA 运行配置的工作目录是 backend/（与本文件 datasource 的相对路径一致），此处配置可直接生效；
# - mvn spring-boot:run 的 fork 工作目录是模块目录 ai-demo/，命令行验证时需用
#   --rag.notes-paths=../../frontend/public/lib/notes --rag.store-path=./db/rag-store.json 覆盖
rag:
  notes-paths: ../frontend/public/lib/notes
  store-path: ./db/rag-store.json

logging:
  level:
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    com.aioverview.backend.aidemo.dao: DEBUG