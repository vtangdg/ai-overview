# 服务器配置
server:
  port: 8090
  # 增加超时设置，适应模型调用的长耗时
  servlet:
    context-path: /
    session:
      timeout: 60s
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000
  # 启用404异常抛出，让全局异常处理器捕获
  error:
    whitelabel:
      enabled: false

# 缓存配置
spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h
  # 应用名称配置
  application:
    name: ai-overview-backend
  # Spring AI 配置（默认使用DeepSeek）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 8000
    # GLM 配置（通过环境变量）
    glm:
      api-key: ${GLM_API_KEY}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        options:
          model: glm-4.7-flash
          temperature: 0.7
          max-tokens: 65536
  # Web配置 - 抛出404异常让全局异常处理器捕获
  web:
    resources:
      add-mappings: false

# Prometheus配置
management:
  metrics:
    export:
      prometheus:
        enabled: true
  # Actuator端点配置
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# RAG 知识问答配置（默认值面向 Docker 容器，本地开发在 application-dev.yml 覆盖路径）
rag:
  # 笔记根目录（容器内由 docker-compose 只读挂载 frontend/public/lib）
  notes-paths: /app/notes
  # 向量索引持久化文件
  store-path: /app/db/rag-store.json
  # 检索参数（阈值依据实测分数分布标定：库内问题普遍 >0.45，库外 <0.2，取分离带中点）
  top-k: 4
  similarity-threshold: 0.35
  # Embedding：智谱 OpenAI 兼容端点（复用 GLM_API_KEY）
  embedding-base-url: https://open.bigmodel.cn/api/paas
  embedding-api-key: ${GLM_API_KEY:}
  embedding-model: embedding-3
  embedding-dimensions: 2048
  # 生成回答的对话模型（对应策略工厂模型名）
  chat-model: deepseek
  # 切块参数
  max-section-chars: 1200
  min-chunk-chars: 30

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.aioverview.backend.aidemo.model
  configuration:
    map-underscore-to-camel-case: true

# 日志配置
logging:
  level:
    root: INFO