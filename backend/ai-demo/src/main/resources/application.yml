# 服务器配置
server:
  port: 8090
  # 增加超时设置，适应模型调用的长耗时
  servlet:
    context-path: /
    session:
      timeout: 60s
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 60000
  # 启用404异常抛出，让全局异常处理器捕获
  error:
    whitelabel:
      enabled: false

# 缓存配置
spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h
  # 应用名称配置
  application:
    name: ai-overview-backend
  # Spring AI 配置（默认使用DeepSeek）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          # 2026-10-03：deepseek-flash（V4.1-Flash，当前官方模型名）默认开启思考模式，
          # 思考模式会让提示词生成/RAG 问答这类轻任务首字延迟成倍增加（当日实测）。
          # 由 DeepSeekThinkingModeConfig 在请求体注入 {"thinking":{"type":"disabled"}} 关闭，
          # 开关见下方 deepseek.thinking-disabled。
          model: deepseek-flash
          temperature: 0.7
          max-tokens: 8000
    # GLM 配置（通过环境变量；key 缺省为空时 GlmStrategy 不可用、回退 DeepSeek）
    glm:
      api-key: ${GLM_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        options:
          model: glm-4.7-flash
          temperature: 0.7
          max-tokens: 65536
  # Web配置 - 抛出404异常让全局异常处理器捕获
  web:
    resources:
      add-mappings: false

# Prometheus配置
management:
  metrics:
    export:
      prometheus:
        enabled: true
    # Timer 直方图桶（分位数必需）：不开的话 Prometheus 只导出 _count/_sum/_max，
    # 看板里所有 histogram_quantile(xxx_bucket) 都会静默查不出数据（面板空白，不报错）。
    # 开关粒度是「meter 名」，与代码里 meterRegistry.timer("xxx") 的字符串一致。
    distribution:
      percentiles-histogram:
        ai.optimizer.ttft: true
        ai.rag.retrieval: true
        ai.rag.ttft: true
      # 收敛桶边界：默认按 1ms~30s 生成整套桶，对这些指标过宽（序列数白涨）
      minimum-expected-value:
        ai.optimizer.ttft: 100ms
        ai.rag.retrieval: 10ms
        ai.rag.ttft: 100ms
      maximum-expected-value:
        ai.optimizer.ttft: 60s
        ai.rag.retrieval: 10s
        ai.rag.ttft: 60s
  # Actuator端点配置
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# RAG 知识问答配置（默认值面向 Docker 容器，本地开发在 application-dev.yml 覆盖路径）
rag:
  # 笔记根目录（容器内由 docker-compose 只读挂载 frontend/public/lib）
  notes-paths: /app/notes
  # 向量索引持久化文件
  store-path: /app/db/rag-store.json
  # 检索参数（阈值依据实测分数分布标定：库内问题普遍 >0.45，库外 <0.2，取分离带中点）
  top-k: 4
  similarity-threshold: 0.35
  # Embedding：智谱 OpenAI 兼容端点（复用 GLM_API_KEY）
  embedding-base-url: https://open.bigmodel.cn/api/paas
  embedding-api-key: ${GLM_API_KEY:}
  embedding-model: embedding-3
  embedding-dimensions: 2048
  # 切块参数
  max-section-chars: 1200
  min-chunk-chars: 30

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.aioverview.backend.aidemo.model
  configuration:
    map-underscore-to-camel-case: true

# DeepSeek 思考模式开关：true = 对 api.deepseek.com 的 /chat/completions 请求体
# 注入 {"thinking":{"type":"disabled"}}（见 DeepSeekThinkingModeConfig），false = 保持默认（开启思考）
deepseek:
  thinking-disabled: true

# 各场景使用的对话模型（模型 id，按前缀路由供应商：deepseek-* → DeepSeek，glm-* → 智谱）。
# 默认值可被环境变量覆盖，在 .env / 启动环境里设置即可切换，无需改代码：
#   AI_MODEL_PROMPT_OPTIMIZER=glm-4.7-flash   # 提示词优化器用免费 GLM
#   AI_MODEL_RAG_QA=deepseek-flash            # RAG 问答用 DeepSeek
# 注意：glm-* 需要 GLM_API_KEY 可用，否则自动回退 DeepSeek；智谱端点不支持
# stream_options.include_usage，RAG 场景切到 glm-* 时需把 rag.usage-in-stream 置 false。
app:
  ai:
    prompt-optimizer-model: ${AI_MODEL_PROMPT_OPTIMIZER:deepseek-flash}
    rag-qa-model: ${AI_MODEL_RAG_QA:deepseek-flash}

# 日志配置
logging:
  level:
    root: INFO